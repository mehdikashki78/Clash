<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>آسمان آهنین - ورود رسمی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* Reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 10%, #0b0e1a, #141a2b);
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    /* Animated background rings */
    .glow-ring {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: 0;
      animation: floatRing 14s infinite alternate ease-in-out;
    }
    .ring1 {
      width: 500px;
      height: 500px;
      background: #ff6b6b;
      top: -150px;
      right: -150px;
    }
    .ring2 {
      width: 600px;
      height: 600px;
      background: #4ecdc4;
      bottom: -200px;
      left: -200px;
      animation-delay: 2s;
    }
    .ring3 {
      width: 300px;
      height: 300px;
      background: #ffe66d;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
      animation-duration: 10s;
    }
    @keyframes floatRing {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 40px) scale(1.15); }
    }

    /* Stars */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 60px;
      padding: 50px 40px 45px;
      max-width: 680px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 40px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: cardFloat 5s infinite alternate ease-in-out;
    }
    @keyframes cardFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    /* LOGO */
    .logo {
      margin-bottom: 30px;
    }
    .logo .en {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 900;
      font-size: 3.8rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #f7d875, #e8a317, #f7d875);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
      line-height: 1.1;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
    }
    .logo .fa {
      font-size: 2rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 2px;
      margin-top: 2px;
      background: linear-gradient(135deg, #c0c0c0, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 10px rgba(255,255,255,0.1);
    }
    .logo .sub {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 3px;
      margin-top: 6px;
      font-weight: 300;
    }

    /* Divider */
    .divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.6), transparent);
      margin: 16px auto 24px;
      border-radius: 4px;
      animation: shimmer 2.5s infinite;
    }
    @keyframes shimmer {
      0% { opacity: 0.3; width: 80px; }
      50% { opacity: 1; width: 140px; }
      100% { opacity: 0.3; width: 80px; }
    }

    /* Main message */
    .main-text {
      font-size: 1.9rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .main-text span {
      background: linear-gradient(135deg, #f9d976, #f39c12);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .sub-message {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 28px;
      line-height: 1.8;
      font-weight: 400;
    }
    .sub-message strong {
      color: #ffe066;
      font-weight: 700;
    }

    /* Official app badge - حالا به صورت دکمه لینک دار */
    .badge-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 60px;
      padding: 14px 34px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .badge-link:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,215,0,0.3);
      transform: scale(1.02);
    }
    .badge-link:active {
      transform: scale(0.96);
    }
    .badge-icon {
      font-size: 28px;
    }
    .badge-text {
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }
    .badge-text small {
      display: block;
      font-weight: 400;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
    }

    .hint {
      margin-top: 30px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
      font-weight: 300;
    }
    .hint i {
      font-style: normal;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    /* Responsive */
    @media (max-width: 500px) {
      .card { padding: 30px 20px; border-radius: 40px; }
      .logo .en { font-size: 2.6rem; }
      .logo .fa { font-size: 1.5rem; }
      .main-text { font-size: 1.4rem; }
      .sub-message { font-size: 0.95rem; }
      .badge-link { padding: 10px 22px; }
      .badge-icon { font-size: 22px; }
    }
  </style>
</head>
<body>

  <!-- Glow rings -->
  <div class="glow-ring ring1"></div>
  <div class="glow-ring ring2"></div>
  <div class="glow-ring ring3"></div>

  <!-- Stars container (JS generates) -->
  <div class="stars" id="starsContainer"></div>

  <!-- Main card -->
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <div class="en">IRON SKY</div>
      <div class="fa">آسمان آهنین</div>
      <div class="sub">★ رسمی ★</div>
    </div>

    <div class="divider"></div>

    <!-- Main message -->
    <div class="main-text">
      <span>فقط با نرم‌افزار رسمی</span>
    </div>
    <div class="sub-message">
      لطفاً برای ورود به بازی، از <strong>نرم‌افزار رسمی</strong> استفاده کنید.<br>
      دسترسی از طریق مرورگر مجاز نیست.
    </div>

    <!-- Official badge as download link -->
    <a href="https://myket.ir/app/com.iron.skyy" class="badge-link" target="_blank" rel="noopener noreferrer">
      <span class="badge-icon">📲</span>
      <span class="badge-text">
        دریافت از مایکت
        <small>نسخه رسمی بازی</small>
      </span>
    </a>

    <div class="hint">
      <i>⏳ در انتظار اتصال از طریق اپلیکیشن...</i>
    </div>
  </div>

  <script>
    // Generate stars
    (function() {
      const container = document.getElementById('starsContainer');
      const count = 100;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1.5;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 5) + 's';
        star.style.animationDuration = (Math.random() * 4 + 2) + 's';
        star.style.opacity = Math.random() * 0.6 + 0.3;
        container.appendChild(star);
      }
    })();
  </script>

</body>
</html>
