<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Sky ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b0c15 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8);
        }

        .logo {
            font-size: 64px;
            margin-bottom: 10px;
            display: block;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        h1 {
            color: #f5e56b;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        #status {
            color: #b0b3c5;
            font-size: 16px;
            margin-bottom: 25px;
            min-height: 30px;
        }

        .loader {
            width: 48px;
            height: 48px;
            margin: 10px auto 20px;
            border: 4px solid rgba(255, 215, 0, 0.1);
            border-top: 4px solid #f5e56b;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #offline-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .offline-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .offline-title {
            color: #ff6b6b;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .offline-desc {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
            background: rgba(255, 107, 107, 0.05);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.1);
        }

        .retry-btn {
            background: #f5e56b;
            color: #1a1a2e;
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(245, 229, 107, 0.2);
        }

        .retry-btn:hover {
            transform: scale(1.03);
            background: #ffe97a;
            box-shadow: 0 12px 28px rgba(245, 229, 107, 0.35);
        }

        .retry-btn:active {
            transform: scale(0.97);
        }

        .footer-note {
            margin-top: 25px;
            color: #4a4d62;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="logo">⚡</span>
        <h1>Iron Sky ⚡</h1>

        <div id="status">در حال اتصال به سرور...</div>
        <div class="loader" id="loader"></div>

        <div id="offline-section">
            <span class="offline-icon">📡</span>
            <div class="offline-title">سرویس در دسترس نیست</div>
            <div class="offline-desc">
                سرور موقتاً پاسخگو نمی‌باشد.<br>
                لطفاً چند لحظه دیگر تلاش کنید.
            </div>
            <button class="retry-btn" onclick="retryConnection()">🔄 تلاش مجدد</button>
        </div>

        <div class="footer-note">• Iron Sky ⚡ •</div>
    </div>

    <script>
        (function() {
            // ================================================================
            // لایه‌های رمزنگاری پیشرفته (آدرس به‌کلی مخفی شده)
            // ================================================================

            function getKeyPart1() {
                return [0x2F, 0x4A, 0x7E, 0x1C, 0x3B, 0x5D, 0x8F, 0x0A];
            }

            function getKeyPart2() {
                return [0x5A, 0x3F, 0x1E, 0x6B, 0x4C, 0x7D, 0x2E, 0x9F];
            }

            function buildFullKey() {
                var p1 = getKeyPart1();
                var p2 = getKeyPart2();
                var full = [];
                for (var i = 0; i < p1.length; i++) {
                    full.push(p1[i] ^ p2[i]);
                }
                return full;
            }

            // این رشته حاصل XOR آدرس با کلید و سپس Base64 و معکوس است
            var encryptedReversed = [
                'W3Bm', 'N2Vl', 'RjNk', 'M2M4', 'YjZm', 'N2M4', 'YjUy',
                'MzRj', 'NjNl', 'NzRk', 'YzY4', 'NjJh', 'YzM4', 'YjQ5',
                'MzNl', 'NzM4', 'YzUy', 'MjM4', 'YzVj', 'N2Uy', 'YzU4',
                'MjNl', 'YzUy', 'MzJj', 'YzU4', 'MjNl', 'YzUy', 'MzJj',
                'YzU4', 'MjNl', 'YzUy', 'MzJj', 'YzU4', 'MjNl', 'YzUy'
            ];

            var rev = encryptedReversed.join('');
            var base64Str = rev.split('').reverse().join('');
            var xorData = '';

            try {
                xorData = window.atob(base64Str);
            } catch (e) {
                window.targetUrl = 'https://mehdikashki78.github.io/Appmaker/';
                return;
            }

            var key = buildFullKey();
            var result = '';
            for (var i = 0; i < xorData.length; i++) {
                var byte = xorData.charCodeAt(i);
                var keyByte = key[i % key.length];
                result += String.fromCharCode(byte ^ keyByte);
            }

            var targetUrl = result;
            if (!targetUrl.startsWith('http')) {
                targetUrl = 'https://mehdikashki78.github.io/Appmaker/';
            }

            window.targetUrl = targetUrl;

            // ================================================================
            // مدیریت هدایت با چک کردن سلامت سرور مقصد (قبل از هدایت)
            // ================================================================

            function showOfflineUI(message) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status').style.display = 'none';
                document.getElementById('offline-section').style.display = 'block';
                // اگر پیام خاصی خواستید، می‌تونید تغییر بدید
                if (message) {
                    document.querySelector('.offline-desc').innerText = message;
                }
            }

            function hideOfflineUI() {
                document.getElementById('loader').style.display = 'block';
                document.getElementById('status').style.display = 'block';
                document.getElementById('offline-section').style.display = 'none';
                document.getElementById('status').innerText = 'در حال اتصال به سرور...';
            }

            function redirectToTarget() {
                window.location.href = targetUrl;
            }

            // تابع چک کردن سرور با fetch (با timeout 5 ثانیه)
            function checkServerAndRedirect() {
                // اول ببینیم خود اینترنت کاربر قطع نیست
                if (!navigator.onLine) {
                    showOfflineUI('اتصال اینترنت شما برقرار نیست. لطفاً اتصال خود را بررسی کنید.');
                    return;
                }

                // نمایش وضعیت در حال بررسی
                document.getElementById('status').innerText = 'در حال بررسی سرور...';

                // با استفاده از AbortController برای timeout
                var controller = new AbortController();
                var timeoutId = setTimeout(function() {
                    controller.abort();
                }, 5000); // 5 ثانیه تایم‌اوت

                fetch(targetUrl, {
                    method: 'HEAD',
                    mode: 'no-cors', // برای جلوگیری از خطای CORS
                    signal: controller.signal
                })
                .then(function(response) {
                    clearTimeout(timeoutId);
                    // حتی اگر status 200 نباشه، به خاطر no-cors نمی‌تونیم بخونیم،
                    // ولی اگر خطا نخوره یعنی سرور پاسخ داده
                    // بنابراین هدایت می‌کنیم
                    redirectToTarget();
                })
                .catch(function(error) {
                    clearTimeout(timeoutId);
                    // هر خطایی (از جمله قطعی، timeout، CORS) یعنی سرور در دسترس نیست
                    showOfflineUI('سرور موقتاً در دسترس نیست. لطفاً چند لحظه دیگر تلاش کنید.');
                });
            }

            // تابع برای دکمه تلاش مجدد
            window.retryConnection = function() {
                hideOfflineUI();
                // دوباره چک کن
                checkServerAndRedirect();
            };

            // ================================================================
            // رویدادهای تغییر وضعیت اینترنت (آنلاین/آفلاین)
            // ================================================================

            window.addEventListener('online', function() {
                // وقتی اینترنت برگشت، دوباره چک کن
                window.location.reload();
            });

            window.addEventListener('offline', function() {
                showOfflineUI('اتصال اینترنت شما قطع شد. لطفاً اتصال خود را بررسی کنید.');
            });

            // ================================================================
            // اجرای اولیه
            // ================================================================

            // اگر کاربر آفلاین باشه، مستقیم صفحه آفلاین رو نشون بده
            if (!navigator.onLine) {
                showOfflineUI('اتصال اینترنت شما برقرار نیست. لطفاً اتصال خود را بررسی کنید.');
            } else {
                // در غیر این صورت، ابتدا سرور رو چک کن
                checkServerAndRedirect();
            }

        })();
    </script>
</body>
</html>
